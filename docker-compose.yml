services:
  iptv-viewer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: channel-club
    ports:
      - "8334:8334"
    env_file:
      - .env
    # Hardened like stack/docker-compose.yaml, so local runs behave like production.
    volumes:
      - channel-club-state:/data
      - channel-club-scratch:/tmp/highlights
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /tmp/cast_hls:size=512m,uid=10001,gid=10001,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    restart: unless-stopped
    # uvicorn's graceful timeout plus the teardown deadline (8 s each) fit in this.
    stop_grace_period: 20s
    init: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8334/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  channel-club-state:
  channel-club-scratch:
