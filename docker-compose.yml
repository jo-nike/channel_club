services:
  iptv-viewer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
        - VITE_WS_URL=${VITE_WS_URL}
        - VITE_STREAM_BASE_URL=${VITE_STREAM_BASE_URL}
        - VITE_CHAT_ENABLED=${VITE_CHAT_ENABLED:-false}
        - VITE_GIF_ENABLED=${VITE_GIF_ENABLED:-false}
    container_name: channel-club
    ports:
      - "8334:8080"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
