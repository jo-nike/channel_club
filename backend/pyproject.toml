[project]
name = "channel-club"
version = "1.1.0"
description = "Channel Club — Good TV. Better company."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "defusedxml>=0.7.1",
    "fastapi>=0.127.0",
    "httpx>=0.28.1",
    "loguru>=0.7.0",
    "pydantic-settings>=2.12.0",
    "python-jose[cryptography]>=3.5.0",
    "uvicorn[standard]>=0.40.0",
    "websockets>=15.0.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.10",
    "basedpyright>=1.29.0",
    "pytest-timeout>=2.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B008",  # Do not perform function call in argument defaults (standard FastAPI pattern)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# A deadlocked test must not block the CI runner indefinitely. The whole suite
# runs in ~10s, so 60s per test is far above any legitimate case; exceeding it
# means something is stuck. The "signal" method fails only the stuck test and
# lets the rest of the suite report. faulthandler_timeout fires just before it
# and dumps every thread's stack, which is what identifies the offending lock.
timeout = 60
timeout_method = "signal"
faulthandler_timeout = 55

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
# Pydantic's populate_by_name=True allows snake_case OR camelCase in constructors,
# but type checkers don't understand this pattern yet. Disable until supported.
reportCallIssue = "none"
