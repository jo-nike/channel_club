# Channel Club CI/CD. Master builds deploy by immutable digest; vX.Y.Z tags
# publish a matching fixed Docker release tag without another deployment.
# Registry credentials are Gitea organization secrets. The deploy key and the
# pinned host keys are repository secrets, which shadow org secrets of the same
# name. Secrets reach scripts only through env: a ${{ secrets.X }} inside run:
# is pasted into the script Gitea prints, and a multi-line key isn't masked.
# The host directory and Infisical path stay unchanged during the rename.

name: CI + Deploy

on:
  push:
    branches:
      - master
    tags:
      - "v*"

env:
  REGISTRY: gitea.example.com
  IMAGE: gitea.example.com/jons-org/channel-club
  DEPLOY_HOST: 192.168.50.108
  DEPLOY_USER: j
  DEPLOY_DIR: /srv/channel-club
  HEALTH_URL: http://192.168.50.108:8334/api/health

jobs:
  test-backend:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/catthehacker/ubuntu:act-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check application version consistency
        run: uv run --frozen python ../scripts/version.py

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (basedpyright)
        run: uv run basedpyright

      - name: Test (pytest)
        run: uv run pytest -q

  test-frontend:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/catthehacker/ubuntu:act-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm --prefix frontend ci

      - name: Lint (eslint)
        run: npm --prefix frontend run lint

      - name: Test (vitest)
        run: npm --prefix frontend test -- --run

      - name: Build
        run: npm --prefix frontend run build

  # Secret + dependency + IaC scanning. Blocks the deploy (release needs it).
  security:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/catthehacker/ubuntu:act-latest
    env:
      TRIVY_VERSION: "0.72.0"
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans full git history

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Trivy + gitleaks
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin "v${TRIVY_VERSION}"
          curl -sfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Secret scan (gitleaks)
        run: gitleaks detect --source . --redact

      - name: Export dependency manifests
        run: |
          mkdir -p .trivy-scan
          (cd backend && uv export --frozen --no-dev --format requirements-txt -o ../.trivy-scan/requirements.txt)
          cp frontend/package-lock.json .trivy-scan/package-lock.json

      - name: Dependency scan (Trivy fs)
        run: trivy fs --scanners vuln,license --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress .trivy-scan

      # node_modules is absent in this job (no npm ci here), but vendored
      # Dockerfiles inside it would otherwise be scanned as if they were ours.
      - name: Misconfig scan (Trivy config)
        run: trivy config --severity HIGH,CRITICAL --exit-code 1 --skip-dirs "**/node_modules" .

  release:
    # Serialize retries for the same release ref before checking/publishing its tag.
    concurrency:
      group: channel-club-publish-${{ github.ref }}
      cancel-in-progress: false
    needs: [test-backend, test-frontend, security]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/catthehacker/ubuntu:act-latest
    env:
      TRIVY_VERSION: "0.72.0"
      # Vite inlines these into the client bundle at build time, so they cannot
      # come from the runtime .env. They are already public in the shipped JS —
      # nothing secret belongs here.
      #
      # Only the vars the frontend actually reads are passed. Deliberately NOT
      # passed, despite being in the old prod .env and in the Dockerfile ARGs:
      #   VITE_WS_URL          — useWebSocket.ts derives the URL from
      #                          window.location.host; the var is never read.
      #   VITE_STREAM_BASE_URL — stream URLs are built server-side from the
      #                          backend's STREAM_BASE_URL.
      # VITE_CAST_BASE_URL is read but left unset on purpose: getCastBaseUrl()
      # then derives the right absolute URL from window.location, which is
      # correct behind the proxy on 443. VITE_BACKEND_PORT is a dev-only override
      # and is not read at all in a prod build, so it is not passed either.
      VITE_API_URL: /api
      VITE_CHAT_ENABLED: "true"
      VITE_GIF_ENABLED: "true"
      VITE_LOG_LEVEL: info
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # host validates source ancestry before accepting a release

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compute application version and unique build identity
        id: ver
        env:
          SOURCE_REF: ${{ github.ref }}
        run: |
          python3 -m scripts.release metadata --ref "$SOURCE_REF" \
            --source "$(git rev-parse HEAD)" --output "$GITHUB_OUTPUT"

      - name: Login to Gitea registry
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: printf '%s\n' "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin

      - name: Reuse an already published matching release
        id: existing
        run: |
          python3 -m scripts.release existing --image "$IMAGE" \
            --source "$(git rev-parse HEAD)" \
            --release-tag "${{ steps.ver.outputs.release_tag }}" --output "$GITHUB_OUTPUT"

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin "v${TRIVY_VERSION}"

      # Tag publication needs registry access only; master also deploys.
      - name: Preflight deploy secrets
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -n "${{ steps.ver.outputs.release_tag }}" ]; then exit 0; fi
          if [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::error::DEPLOY_KNOWN_HOSTS secret is not set — populate it with \`ssh-keyscan $DEPLOY_HOST\` output captured from a trusted vantage point before deploying."
            exit 1
          fi
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::SSH_PRIVATE_KEY secret is not set — cannot deploy."
            exit 1
          fi

      - name: Build image
        run: |
          if [ "${{ steps.existing.outputs.exists }}" = true ]; then exit 0; fi
          VERSION="${{ steps.ver.outputs.version }}"
          BUILD_ID="${{ steps.ver.outputs.build_id }}"
          docker build --pull \
            --build-arg APP_BUILD_ID="$BUILD_ID" \
            --build-arg APP_REVISION="$(git rev-parse HEAD)" \
            --label org.opencontainers.image.title="Channel Club" \
            --label org.opencontainers.image.version="$VERSION" \
            --label org.opencontainers.image.revision="$(git rev-parse HEAD)" \
            --build-arg APT_REFRESH="$(date -u +%Y-%m-%d)" \
            --build-arg VITE_API_URL="$VITE_API_URL" \
            --build-arg VITE_CHAT_ENABLED="$VITE_CHAT_ENABLED" \
            --build-arg VITE_GIF_ENABLED="$VITE_GIF_ENABLED" \
            --build-arg VITE_LOG_LEVEL="$VITE_LOG_LEVEL" \
            -t "$IMAGE:$BUILD_ID" .

      # Scan before publishing, so a vulnerable image never reaches the
      # registry or plex-stack.
      - name: Scan image (Trivy)
        run: |
          if [ "${{ steps.existing.outputs.exists }}" = true ]; then exit 0; fi
          BUILD_ID="${{ steps.ver.outputs.build_id }}"
          trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 "$IMAGE:$BUILD_ID"

      - name: Publish scanned image and resolve immutable digest
        id: artifact
        run: |
          if [ "${{ steps.existing.outputs.exists }}" = true ]; then
            echo "image_reference=${{ steps.existing.outputs.image_reference }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 -m scripts.release publish --image "$IMAGE" \
            --source "$(git rev-parse HEAD)" --build-id "${{ steps.ver.outputs.build_id }}" \
            --release-tag "${{ steps.ver.outputs.release_tag }}" --output "$GITHUB_OUTPUT"

      - name: Deploy to plex-stack
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -n "${{ steps.ver.outputs.release_tag }}" ]; then exit 0; fi
          VERSION="${{ steps.ver.outputs.version }}"
          IMAGE_REFERENCE="${{ steps.artifact.outputs.image_reference }}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pin the deploy host's key instead of trusting whatever answers at
          # run time: ssh-keyscan here would be trust-on-every-run and is
          # spoofable by anyone on-path for $DEPLOY_HOST. DEPLOY_KNOWN_HOSTS
          # must be populated with `ssh-keyscan 192.168.50.108` output
          # captured once from a trusted vantage point.
          if [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::error::DEPLOY_KNOWN_HOSTS secret is not set — refusing to deploy with an unpinned host key. Populate it with \`ssh-keyscan $DEPLOY_HOST\` output from a trusted vantage point."
            exit 1
          fi
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes"
          REMOTE="$DEPLOY_USER@$DEPLOY_HOST"
          $SSH "$REMOTE" "mkdir -p '$DEPLOY_DIR'"
          # Secrets never ship from CI: the Infisical-rendered .env must exist.
          $SSH "$REMOTE" "test -f '$DEPLOY_DIR/.env'" \
            || { echo "::error::$DEPLOY_DIR/.env missing on $DEPLOY_HOST — add the Infisical template before deploying"; exit 1; }
          # Upload to a unique staging directory; active compose is only written
          # by the host helper while holding its lock through health verification.
          STAGING=$($SSH "$REMOTE" "mktemp -d '$DEPLOY_DIR/.release.XXXXXXXX'")
          trap '$SSH "$REMOTE" "rm -rf -- \"$STAGING\""' EXIT
          sed "s#\${IMAGE_REFERENCE:?Immutable image digest required}#$IMAGE_REFERENCE#g" stack/docker-compose.yaml > /tmp/rendered-compose.yaml
          git rev-list HEAD > /tmp/source-history
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes /tmp/rendered-compose.yaml "$REMOTE:$STAGING/docker-compose.yaml"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes /tmp/source-history scripts/deploy_release.py "$REMOTE:$STAGING/"
          $SSH "$REMOTE" "python3 '$STAGING/deploy_release.py' '$DEPLOY_DIR' '$STAGING' '$(git rev-parse HEAD)' '$VERSION' '$HEALTH_URL' '$IMAGE_REFERENCE' --build-id '${{ steps.ver.outputs.build_id }}'"

      - name: Cleanup deploy key
        if: always()
        run: rm -f ~/.ssh/deploy_key /tmp/rendered-compose.yaml /tmp/source-history /tmp/repo-digests.json
