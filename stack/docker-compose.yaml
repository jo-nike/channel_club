# Production compose for Channel Club. This file is canonical: CI renders
# ${IMAGE_REFERENCE:?Immutable image digest required} to the pushed registry digest, scp's the result to
# plex-stack at /srv/channel-club/docker-compose.yaml,
# and runs `docker compose up -d` there.
#
# Image references only, never a `build:` key — the image is built and scanned
# in CI before it ever reaches the host. The repo-root docker-compose.yml is
# the local build-from-source counterpart.
#
# .env is NOT deployed from CI. The Infisical agent on plex-stack renders it
# from the homelab-infra store at /plex/iptv_viewer. A new stack has no .env
# until those secrets and a host template exist, so CI asserts the file is
# present before deploying rather than starting with empty variables.
#
# The CI render is a literal string replace of "${IMAGE_REFERENCE:?Immutable image digest required}", so
# that expression must be written exactly that way.

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  iptv-viewer:
    image: ${IMAGE_REFERENCE:?Immutable image digest required}
    container_name: channel-club
    ports:
      - "8334:8080"
    env_file:
      - .env
    # Reach Dispatcharr over the WireGuard tunnel (the VPS is 10.8.0.2). Its M3U/EPG
    # endpoints only admit allow-listed addresses, and the home public IP is dynamic;
    # the VPN range is allowed. Browsers still resolve streams.example.com publicly.
    extra_hosts:
      - "streams.example.com:10.8.0.2"
    restart: unless-stopped
    # uvicorn's graceful timeout plus the teardown deadline (8 s each) fit in this.
    stop_grace_period: 20s
    init: true
    logging: *bounded-logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      mcp.role: "Channel Club web app (Dispatcharr/ErsatzTV front end)"
      mcp.auth: "plex-oauth"
